name: Template Verification

# Everything a consumer of the published NuGet package actually touches: the package itself,
# the scaffolded source tree, and the running API. Template-repo only - template.json excludes
# this file (and .github/scripts) from scaffolded projects, which have no template-pack/.
on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack
        run: dotnet pack template-pack/BaseRepository.Template.csproj --configuration Release --output ${{ runner.temp }}/nupkg

      - name: Verify package contents
        run: |
          set -euo pipefail
          pkg=$(ls ${{ runner.temp }}/nupkg/*.nupkg)
          unzip -l "$pkg"
          # nuget.org renders the root README as the package page; the template is unusable
          # without template.json and the source tree.
          unzip -l "$pkg" | grep -q " README.md$"
          unzip -l "$pkg" | grep -q "content/.template.config/template.json"
          unzip -l "$pkg" | grep -q "content/src/Api/Program.cs"
          unzip -l "$pkg" | grep -q "content/BaseRepository.sln"
          # Build leftovers, the dev database, and the template's own packaging project
          # must never ship.
          ! unzip -l "$pkg" | grep -qE "content/.*/(bin|obj)/|\.db$|content/template-pack/"

      - name: Verify package metadata
        run: |
          set -euo pipefail
          pkg=$(ls ${{ runner.temp }}/nupkg/*.nupkg)
          unzip -p "$pkg" '*.nuspec' > nuspec.xml
          cat nuspec.xml
          # nuget.org rejects or degrades a listing missing any of these.
          grep -q "<packageTypes>" nuspec.xml
          grep -q 'name="Template"' nuspec.xml
          grep -q "<license type=\"expression\">MIT</license>" nuspec.xml
          grep -q "<readme>README.md</readme>" nuspec.xml
          grep -q "<projectUrl>" nuspec.xml
          grep -q "<repository " nuspec.xml
          grep -q "<tags>" nuspec.xml
          # A template package must not carry library dependencies.
          ! grep -q "<dependency " nuspec.xml

      - name: Verify the packed README renders standalone on nuget.org
        run: |
          set -euo pipefail
          pkg=$(ls ${{ runner.temp }}/nupkg/*.nupkg)
          unzip -p "$pkg" README.md > packed-readme.md
          # nuget.org does not resolve repo-relative links, so every link must be absolute.
          relative=$(grep -oE '\]\([^)#][^)]*\)' packed-readme.md | grep -vE '\]\((https?|mailto):' || true)
          if [ -n "$relative" ]; then echo "Relative links in the packed README:"; echo "$relative"; exit 1; fi
          echo "All links absolute."

      - uses: actions/upload-artifact@v4
        with:
          name: template-nupkg
          path: ${{ runner.temp }}/nupkg/*.nupkg

  scaffold:
    name: Scaffold (${{ matrix.name }}, ${{ matrix.framework }}, ${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A dotted name, a single-word name, a name containing the template's own words
          # (which breaks a naive string replacement), and a hyphenated one that is not a
          # valid C# identifier.
          - { os: ubuntu-latest, name: Acme.Store, framework: net10.0 }
          - { os: ubuntu-latest, name: Shop, framework: net10.0 }
          - { os: ubuntu-latest, name: BaseRepositoryClone, framework: net10.0 }
          - { os: ubuntu-latest, name: my-api, framework: net10.0 }
          # Both supported frameworks must build and pass the same suite.
          - { os: ubuntu-latest, name: Acme.Store, framework: net9.0 }
          - { os: ubuntu-latest, name: my-api, framework: net9.0 }
          # The template is cross-platform or it is not; SQLite and path handling differ.
          - { os: windows-latest, name: Acme.Store, framework: net10.0 }
          - { os: macos-latest, name: Acme.Store, framework: net9.0 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: template-nupkg
          path: nupkg

      - name: Install the template from the .nupkg
        shell: bash
        run: dotnet new install "$(ls nupkg/*.nupkg | head -1)"

      - name: The template is listed by dotnet new
        shell: bash
        run: dotnet new list | grep -q basecrud

      - name: Scaffold
        shell: bash
        run: dotnet new basecrud -n ${{ matrix.name }} -o out --framework ${{ matrix.framework }} --skipRestore

      - name: Resolve the solution name (hyphens become underscores)
        shell: bash
        working-directory: out
        run: echo "SLN=$(ls *.sln)" >> "$GITHUB_ENV"

      - name: The chosen framework is what got generated
        shell: bash
        working-directory: out
        run: |
          set -uo pipefail
          grep -q "<TargetFramework>${{ matrix.framework }}</TargetFramework>" Directory.Build.props
          # Exactly one version per package - the other framework's block must be gone.
          dupes=$(grep -oP '(?<=PackageVersion Include=")[^"]+' Directory.Packages.props | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "duplicate PackageVersion entries:"; echo "$dupes"; exit 1; fi

      - name: Verify the scaffolded tree
        shell: bash
        working-directory: out
        run: bash ../.github/scripts/verify-scaffolded-tree.sh ${{ matrix.name }}

      - name: Build (no warnings allowed)
        shell: bash
        working-directory: out
        run: |
          set -uo pipefail
          dotnet build "$SLN" --configuration Release 2>&1 | tee build.log
          grep -q "0 Warning(s)" build.log

      - name: Test
        shell: bash
        working-directory: out
        run: dotnet test "$SLN" --no-build --configuration Release

      - name: Scaffolding twice in a row works (with the post-action restore)
        shell: bash
        run: |
          dotnet new basecrud -n SecondPass -o out2 --framework ${{ matrix.framework }}
          test -f out2/SecondPass.sln

      - name: Uninstalling the template works
        shell: bash
        run: |
          dotnet new uninstall BaseRepository.Template
          ! dotnet new list | grep -q basecrud

  runtime:
    name: Runtime (README quick start, verbatim)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: template-nupkg
          path: nupkg

      - name: Install and scaffold
        run: |
          dotnet new install "$(ls nupkg/*.nupkg | head -1)"
          dotnet new basecrud -n Acme.Store -o app

      # Exactly the commands the README's Configuration section gives a consumer. If this
      # does not produce a working signing key, the README is wrong.
      - name: Configure the signing key the way the README says to
        working-directory: app
        run: |
          dotnet user-secrets init --project src/Api
          dotnet user-secrets set Jwt:SigningKey "$(head -c 48 /dev/urandom | base64)" --project src/Api

      - name: Run it (dotnet run, no extra flags - as documented)
        working-directory: app
        run: |
          nohup dotnet run --project src/Api > ${{ runner.temp }}/app.log 2>&1 &
          echo $! > ${{ runner.temp }}/app.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/health >/dev/null 2>&1; then
              echo "Up after ${i}s on the documented port 5000"; exit 0
            fi
            sleep 1
          done
          echo "The app never answered on http://localhost:5000 - the port the README tells users to curl"
          cat ${{ runner.temp }}/app.log
          exit 1

      - name: Exercise every documented endpoint
        run: bash .github/scripts/verify-scaffolded-api.sh http://localhost:5000 Acme.Store

      - name: App log
        if: always()
        run: cat ${{ runner.temp }}/app.log || true

      - name: Stop
        if: always()
        run: kill "$(cat ${{ runner.temp }}/app.pid)" 2>/dev/null || true

  runtime-unconfigured:
    name: Runtime (no configuration at all)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: template-nupkg
          path: nupkg

      - name: Install and scaffold
        run: |
          dotnet new install "$(ls nupkg/*.nupkg | head -1)"
          dotnet new basecrud -n Acme.Store -o app

      - name: Run with no signing key configured
        working-directory: app
        run: |
          nohup dotnet run --project src/Api > ${{ runner.temp }}/app.log 2>&1 &
          echo $! > ${{ runner.temp }}/app.pid
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5000/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat ${{ runner.temp }}/app.log; exit 1

      # README: "Health/root/OpenAPI/Scalar stay open with no config at all; protected
      # endpoints fail clearly until you configure a key."
      - name: Public endpoints work unconfigured; protected ones fail cleanly
        run: |
          set -euo pipefail
          for path in /health / /openapi/v1.json /scalar/v1; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5000$path")
            echo "GET $path -> $code"
            [ "$code" = "200" ]
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/v1/todo-items)
          echo "GET /api/v1/todo-items (no key configured) -> $code"
          # A clear 401, not a 500: an unconfigured key is a configuration state, not a crash.
          [ "$code" = "401" ]

      - name: App log
        if: always()
        run: cat ${{ runner.temp }}/app.log || true

      - name: Stop
        if: always()
        run: kill "$(cat ${{ runner.temp }}/app.pid)" 2>/dev/null || true

  edge-case-names:
    name: Edge-case names (${{ matrix.name }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Names that are unusual but still valid C# identifiers - these must work.
        name: ["acme.store", "Api2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: template-nupkg
          path: nupkg

      - name: Install and scaffold '${{ matrix.name }}'
        run: |
          dotnet new install "$(ls nupkg/*.nupkg | head -1)"
          dotnet new basecrud -n '${{ matrix.name }}' -o out --skipRestore

      - name: Verify the scaffolded tree
        working-directory: out
        run: bash ../.github/scripts/verify-scaffolded-tree.sh '${{ matrix.name }}'

      - name: Build
        working-directory: out
        run: dotnet build "$(ls *.sln)" --configuration Release

  sdk9-only:
    name: On the .NET 9 SDK alone
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: template-nupkg
          path: nupkg

      # global.json keeps every dotnet command in here on the 9 SDK even though the runner
      # also has 10 - this is the consumer who has not upgraded.
      - name: Pin to the .NET 9 SDK
        run: |
          set -uo pipefail
          mkdir -p sdk9
          cat > sdk9/global.json <<'JSON'
          { "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }
          JSON
          cd sdk9 && dotnet --version

      - name: Install the template
        working-directory: sdk9
        run: dotnet new install "$(ls ../nupkg/*.nupkg | head -1)"

      - name: "--framework net9.0 scaffolds, builds and passes the whole suite"
        working-directory: sdk9
        run: |
          set -uo pipefail
          dotnet new basecrud -n Sdk9App -o app --framework net9.0
          grep -q "<TargetFramework>net9.0</TargetFramework>" app/Directory.Build.props
          dotnet build app/Sdk9App.sln --configuration Release
          dotnet test app/Sdk9App.sln --no-build --configuration Release

      # Taking the net10.0 default on this SDK cannot work. It must fail, and the output has
      # to tell the consumer what to do instead.
      - name: The net10.0 default fails with actionable output
        working-directory: sdk9
        run: |
          set -uo pipefail
          if dotnet new basecrud -n DefaultOnSdk9 -o dflt > out.log 2>&1; then
            echo "Expected the net10.0 default to fail on the .NET 9 SDK."; exit 1
          fi
          echo "--- what the consumer sees ---"
          cat out.log
          grep -qiE "framework net9.0|NETSDK1045" out.log

  cli-help:
    name: dotnet new basecrud --help
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: template-nupkg
          path: nupkg

      - name: Install the template
        run: dotnet new install "$(ls nupkg/*.nupkg | head -1)"

      # The command line is where most people meet this template, so its help has to carry
      # the options and what they do - not just a bare template name.
      - name: Help documents the options
        run: |
          set -uo pipefail
          dotnet new basecrud --help | tee help.txt
          echo "--- template options as the CLI renders them ---"
          grep -E '^\s+-' help.txt
          grep -q -- "--framework" help.txt
          grep -q "net10.0" help.txt
          grep -q "net9.0" help.txt
          grep -q -- "--skipRestore" help.txt
          grep -qi "clean architecture" help.txt
          # The option has to actually accept the value, not just appear in help.
          dotnet new basecrud -n HelpOptionCheck -o optcheck --framework net9.0 --skipRestore
          grep -q "<TargetFramework>net9.0</TargetFramework>" optcheck/Directory.Build.props

      - name: Creating a project prints next steps
        run: |
          set -uo pipefail
          dotnet new basecrud -n HelpDemo -o demo --skipRestore | tee create.txt
          grep -qi "user-secrets set Jwt:SigningKey" create.txt
          grep -qi "dotnet run --project src/Api" create.txt
          grep -qi "dotnet test" create.txt
