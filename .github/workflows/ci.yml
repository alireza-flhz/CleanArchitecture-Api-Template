name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore BaseRepository.sln

      - name: Build
        run: dotnet build BaseRepository.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test BaseRepository.sln --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  template-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Regression guard for the dotnet-new template mechanism itself (source substitution,
      # renamed csproj/sln, primaryOutputs restore) - exercised through the *packaged*
      # template, i.e. the exact artifact nuget.org would serve, so packaging mistakes
      # (a file excluded from the nupkg, a broken PackagePath) fail CI too.
      - name: Pack the template
        run: dotnet pack template-pack/BaseRepository.Template.csproj --configuration Release --output ${{ runner.temp }}/nupkg

      - name: Verify package contents
        run: |
          set -euo pipefail
          pkg=$(ls ${{ runner.temp }}/nupkg/*.nupkg)
          echo "Inspecting $pkg"
          unzip -l "$pkg"
          # nuget.org renders the root README as the package page; the template itself is
          # unusable without .template.config/template.json and the source tree.
          unzip -l "$pkg" | grep -q " README.md$"
          unzip -l "$pkg" | grep -q "content/.template.config/template.json"
          unzip -l "$pkg" | grep -q "content/src/Api/Program.cs"
          # Build leftovers and the dev database must never ship.
          ! unzip -l "$pkg" | grep -qE "content/.*/(bin|obj)/|\.db$"

      - name: Install the template from the .nupkg
        run: dotnet new install ${{ runner.temp }}/nupkg/BaseRepository.Template.*.nupkg

      - name: Scaffold a project from it
        run: dotnet new basecrud -n CiSmokeTest -o ${{ runner.temp }}/ci-smoke-test

      - name: Build the scaffolded project
        run: dotnet build ${{ runner.temp }}/ci-smoke-test/CiSmokeTest.sln --configuration Release

      - name: Test the scaffolded project
        run: dotnet test ${{ runner.temp }}/ci-smoke-test/CiSmokeTest.sln --no-build --configuration Release

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: template-nupkg
          path: ${{ runner.temp }}/nupkg/*.nupkg
